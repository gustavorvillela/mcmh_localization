#======================================
# General parameters
#=======================================

# Define these parameters based on localization mode and initial conditions
# Mode options:
#   ."MCL"    - Monte Carlo Localization (MCL)
#   ."AMCL"   - Adaptive Monte Carlo Localization (AMCL)
#   ."MHMCL"  - Metropolis-Hastings Monte Carlo Localization (MHMCL)
#   ."AMHMCL" - Assymetric Metropolis-Hastings Monte Carlo Localization (AMHMCL)
#
# If you want an initial guess to ease convergence, set initialized to True and provide
# the initial pose in the launch file or using a 2D Pose Estimate in RViz
#
# Choose the number of initial particles based on your environment size and
# the expected initial uncertainty of the robot pose

#localization_mode: "MHMCL"  
initialized: False
use_sim_time: True
init_particles: 100
headless: False  # If True, the node will not publish visualization markers for particles (useful for performance in large environments)


meta_lambda: 0.52  # Exponential recency weighting factor for Meta-MH 
random_steps: 60  # Number of random walk steps per odometry update (tune based on your robot's motion characteristics)

#=======================================
# Motion model parameters
#=======================================

# Tune these parameters based on your robot's motion characteristics

alpha1: 0.16  # rotation noise due to rotation   - 0.26
alpha2: 0.175  # rotation noise due to translation - 0.075 
alpha3: 0.18  # translation noise due to translation - 0.28
alpha4: 0.05  # translation noise due to rotation - 0.075

# Additional noise parameters for the random walk step in 3MCL/Augmented-3MCL to encourage exploration and prevent particle deprivation, especially in the early stages of localization or when the robot is lost. Tune these based on your environment and robot's motion characteristics.
alpha5: 0.145  # additional noise for in-place rotation - 0.02
alpha6: 0.145  # additional noise for in-place translation - 0.04
alpha7: 0.142  # additional noise for small forward movement - 0.01
alpha8: 0.142   # additional noise for small backward movement - 0.01

#=======================================
# KLD Resampling parameters
#=======================================

kld_epsilon: 0.01
kld_z: 2.326 # 99% confidence interval
kld_bin_size_xy: 0.005  # 5 cm
kld_bin_size_theta: 0.017  # 11 angle in radians
#kld_delta: 0.9
#min_particles: 200
#max_particles: 2500


#=======================================
# AMCL parameters
#=======================================

alpha_slow: 0.0001 # slow learning rate
alpha_fast: 0.01  # fast learning rate



#=======================================
# Sensor model parameters
#=======================================

# Tune these parameters based on your LiDAR characteristics and environment
# or using a learn intrinsic parameters method

sigma_hit: 0.05   # 0.22
z_hit: 0.9     # 0.85
z_rand: 0.1      # 0.15
max_range: 8.0    # 8.0
step: 1

