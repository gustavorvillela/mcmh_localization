#======================================
# amhmcl_medium.yaml
# Perfil: MÉDIO (M)
# Equilíbrio entre velocidade de convergência e robustez
# Baseado nos valores originais do amhmcl.yaml
#======================================

localization_mode: "MCL"
initialized: False
init_particles: 500
headless: False

#=======================================
# Motion model — ruído moderado (valores originais)
#=======================================
alpha1: 0.010
alpha2: 0.012
alpha3: 0.008
alpha4: 0.004
alpha5: 0.020
alpha6: 0.030

#=======================================
# KLD Resampling — balanço padrão
#=======================================
kld_epsilon: 0.05
kld_z: 0.99
kld_bin_size_xy: 0.15
kld_bin_size_theta: 0.20
kld_delta: 0.90
min_particles: 200
max_particles: 2500

#=======================================
# AMCL
#=======================================
alpha_slow: 0.001
alpha_fast: 0.010

#=======================================
# Sensor model — valores originais
#=======================================
sigma_hit: 0.35
z_hit: 0.75
z_rand: 0.20
max_range: 8.0
step: 1
