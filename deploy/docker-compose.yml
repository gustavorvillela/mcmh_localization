services:
  ros_noetic_dev:
    build:
      context: ../..
      dockerfile: mcmh_localization/deploy/Dockerfile

    container_name: ros_noetic_dev

    network_mode: host

    gpus: all

    volumes:
      - ..:/root/catkin_ws/src/mcmh_localization
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw 
      - ~/.gazebo/gui.ini:/root/.gazebo/gui.ini:ro
      - ~/.gazebo/models:/root/.gazebo/models:rw
      - /opt/ros/noetic/share/turtlebot3_description:/opt/ros/noetic/share/turtlebot3_description:ro
      - ../../turtlebot3_diff:/root/catkin_ws/src/turtlebot3_diff:rw
      - ../../turtlebot3_simulations:/root/catkin_ws/src/turtlebot3_simulations:rw

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - OGRE_RTT_MODE=Copy
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XAUTHLOCALHOSTNAME=localhost

    devices:
      - /dev/dri:/dev/dri

    stdin_open: true
    tty: true
    privileged: true